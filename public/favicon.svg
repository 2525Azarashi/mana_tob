<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="マナトビ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F4E7C"/>
      <stop offset="1" stop-color="#0A3D62"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FD4FF"/>
      <stop offset="1" stop-color="#1976D2"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 扉の枠（学びの扉） -->
  <path d="M18 50V28c0-7.7 6.3-14 14-14s14 6.3 14 14v22z"
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>

  <!-- 開いた扉から差す光 -->
  <path d="M32 47V29.5c0-4.6 3.4-8.5 7.8-9.3V47z" fill="url(#light)"/>

  <!-- 敷居 -->
  <rect x="14" y="47" width="36" height="5" rx="2.5" fill="#FFFFFF"/>
</svg>
