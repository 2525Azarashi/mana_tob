<!DOCTYPE html>
<html lang="ja">
<head>

  <title>学びの扉</title>
  <script>
    // GitHub Pages 等の静的ホスティングで直接URLアクセスされた場合、
    // SPA のルーティングに引き渡すためのフォールバック。

    location.replace('/');
  </script>
