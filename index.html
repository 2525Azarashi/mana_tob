    <!--
      フォント。
      [重要] 看板（ヒーローの「学びの扉」とキャッチコピー）の書体は
        サイトの第一印象を決める要素です。削除しないでください。

        ・Zen Old Mincho … 和文の看板書体。「学びの扉」の日本語部分に使います。
          [重要] これが本命です。以前は Playfair Display だけを指定していましたが、
            Playfair には和文グリフが無いため「学びの扉」は
            本文と同じ Noto Sans JP で描かれてしまい、
            見出しがまったく引き立っていませんでした。
            和文の看板書体を必ず先に指定してください。
        ・Playfair Display … 欧文（Manabi-no-Tobira 等）用。
        ・Noto Sans JP … 本文用。

        ウェイトは実際に使うものだけに絞っています
        （Zen Old Mincho は 700/900、Playfair は 700 のみ）。
    -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        /*
          ===== デザイントークン =====
          [重要] 本文に使う色は WCAG AA（4.5:1）以上を満たすものだけを定義しています。
            --text-faint は「文字」ではなく罫線・非テキストのアイコン専用です。
            文字色として --text-faint を使わないでください。
        */
        :root {
            --brand-blue: #0A3D62;   /* 対白 11.3:1 */
            --brand-hover: #0d4d7a;
            --accent-blue: #1565C0;  /* 対白  5.6:1 */
            --text-strong: #0F2A3D;  /* 見出し */
            --text-body: #3F4B5B;    /* 本文   対白 8.6:1 */
            --text-muted: #5A6675;   /* 補助   対白 6.0:1 */
            --text-faint: #94a3b8;   /* 非テキスト専用（罫線・装飾アイコン） */
            --surface: #ffffff;
            --surface-sunken: #F7F9FC;
            --border: #E3E8EF;
            --border-strong: #CBD5E1;

            /* 影：ごく浅い多層シャドウで「浮き」を作る（大きなぼかしは使わない） */
            --shadow-sm: 0 1px 2px rgba(15, 42, 61, 0.04), 0 1px 3px rgba(15, 42, 61, 0.06);
            --shadow-md: 0 2px 4px rgba(15, 42, 61, 0.04), 0 4px 12px rgba(15, 42, 61, 0.07);
            --shadow-lg: 0 4px 8px rgba(15, 42, 61, 0.05), 0 12px 28px rgba(15, 42, 61, 0.09);
        }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
            margin: 0;
            background-color: var(--surface);
            color: var(--text-body);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* 日本語の可読性：約物を詰めすぎない */
            font-feature-settings: 'palt' 1;
            text-rendering: optimizeLegibility;
        }
        /*
          見出しは字面を締める。
          [重要] color はここで指定しません。
            濃色背景の上に置いた見出し（text-white 等）を打ち消してしまい、
            暗い文字が暗い背景に乗る不具合が起きるためです。
            見出しの色は各コンポーネント側で text-ink-strong / text-white を明示してください。
        */
        h1, h2, h3, h4 {
            letter-spacing: 0.01em;
        }
        /* 数値は等幅にして桁を揃える */
        .tabular-nums { font-variant-numeric: tabular-nums; }

        /* 立体感ユーティリティ */
        .elev-sm { box-shadow: var(--shadow-sm); }
        .elev-md { box-shadow: var(--shadow-md); }
        .elev-lg { box-shadow: var(--shadow-lg); }
        /* カードのホバー：1px 浮かせるだけ。派手に動かさない */
        .lift {
            transition: box-shadow .25s cubic-bezier(0.16,1,0.3,1),
                        transform .25s cubic-bezier(0.16,1,0.3,1),
                        border-color .25s ease;
            will-change: transform;
        }
        @media (hover: hover) {
            .lift:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        }
        /* リンクの下線を文字にぶつけない */
        .link-underline {
            text-decoration: underline;
            text-decoration-color: rgba(21, 101, 192, .35);
            text-underline-offset: 3px;
            text-decoration-thickness: 1.5px;
            transition: text-decoration-color .2s ease;
        }
        .link-underline:hover { text-decoration-color: rgba(21, 101, 192, .9); }

        /* フォーカスリング（アクセシビリティ） */
        :focus-visible {
            outline: 3px solid var(--accent-blue);
            outline-offset: 2px;
            border-radius: 4px;
        }
        /*
          ===== ブランド書体（看板用） =====
          [重要] ヒーローの「学びの扉」とキャッチコピーに使う書体です。
            サイトの第一印象を決める要素なので削除しないでください。
            本文には使いません（長文で読みにくくなるため）。

          [重要] 和文書体（Zen Old Mincho）を必ず Playfair より先に書きます。
            Playfair Display には和文グリフが無いため、先に書いてしまうと
            「学びの扉」が本文と同じゴシック体で描かれ、
            見出しがまったく引き立ちません（実際にその状態でした）。
        */
        .font-brand {
            font-family: 'Zen Old Mincho', 'Playfair Display', 'Noto Serif JP', serif;
        }

        /*
          ===== サイトの看板「学びの扉」 =====
          [重要] ここは「インパクトがあり、かつ感動的」であることを狙った演出です。
            単なる太字に戻さないでください。内訳は次の3つです。

            1. 明朝体の縦画と横画のコントラスト（Zen Old Mincho / 900）
               … 毛筆に近い抑揚が出て、ゴシック体より格調が生まれます
            2. 字間を詰める（tracking）
               … 大きな見出しは既定の字間だと間延びして締まりません
            3. 縦方向のグラデーション＋淡い発光
               … 「扉の向こうから光が差す」印象をつくります

          可読性について:
            発光（text-shadow）はごく淡い青のみで、文字色そのものは
            変えていません。コントラスト比は下の色指定で担保しています。
        */
        .hero-title {
            font-family: 'Zen Old Mincho', 'Noto Serif JP', serif;
            font-weight: 900;
            letter-spacing: 0.02em;
            /*
              ごく淡い発光。数値を上げすぎると文字が滲んで読みにくくなるため、
              ぼかしは大きく・不透明度は低くしています。
            */
            text-shadow:
                0 1px 0 rgba(255, 255, 255, .6),
                0 10px 30px rgba(21, 101, 192, .15),
                0 2px 6px rgba(10, 61, 98, .10);
        }
        /*
          ===== 「扉」の一文字（看板の主役） =====
          [重要] この一文字が団体名の核なので、まわりの「学びの」より
            "弱く" 見えてはいけません。以前は上端を明るい青
            (#2E6FE0) にしていたため、主役が一番淡いという逆転が
            起きていました。いまは次の3点で主役に見えるようにしています。

            1. 少しだけ大きく組む（font-size: 1.08em）
               … 明朝体の一文字強調は日本語組版の定石です
            2. 周囲の「学びの」（#0A3D62）より必ず「濃い」グラデーション
               … [重要] 上端を周囲と同色から始め、下へ向かって
                 さらに深い藍に落とします。上端を明るくすると
                 主役が一番淡く見えてしまうので、絶対に明るくしないこと。
                 明暗差は中間に置いた僅かな照り（#10528F）だけで出します。
            3. 背後に淡い光のにじみ（::before の放射グラデーション）
               … 「開いた扉の向こうから光が差す」情景をつくります
                 文字自体を明るくせず、背後の光で感動的に見せる狙いです

          [重要] background-clip: text は文字を透明にする手法なので、
            非対応ブラウザで文字が消えないよう
            必ず color でフォールバックの色を指定してください
            （JSX 側の style で #0A3D62 を渡しています）。
        */
        .hero-title-accent {
            position: relative;
            display: inline-block;
            font-size: 1.08em;
            line-height: 1;
            background-image: linear-gradient(172deg, #0A3D62 0%, #10528F 38%, #062A47 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            /*
              [重要] text-shadow: none は必須です。消さないでください。
                background-clip: text は「背景」を文字型に切り抜く手法で、
                その背景は text-shadow より下に描かれます。
                そのため親の .hero-title から白い text-shadow を
                継承すると、白い影がグラデーションの上に乗って
                「扉」だけが色あせて見えます
                （実測: 平均輝度 94.9 対 他の文字 60.6 まで薄くなっていました）。
                光の演出は下の ::before（文字の背面）だけで行います。
            */
            text-shadow: none;
        }
        /*
          扉の背後の光。文字の可読性を落とさないよう、
          不透明度は低く・ぼかし（グラデーションの裾）は広くしています。
          [重要] z-index: -1 で文字の背面に置いています。
            親の .hero-title-accent から position: relative を外すと
            光が別の場所に飛ぶので、セットで扱ってください。
        */
        .hero-title-accent::before {
            content: '';
            position: absolute;
            z-index: -1;
            left: 50%;
            top: 50%;
            width: 210%;
            height: 165%;
            transform: translate(-50%, -50%);
            background: radial-gradient(closest-side,
                rgba(126, 199, 255, .40) 0%,
                rgba(126, 199, 255, .18) 45%,
                rgba(126, 199, 255, 0) 72%);
            pointer-events: none;
        }

          [重要] サイトの季節感・情緒を担う装飾です。削除しないでください。
            ・pointer-events: none で操作の妨げになりません
            ・z-index は 1（本文コンテンツは z-10 以上に置くこと）
            ・opacity を低く抑え、文字の可読性を損なわないようにしています
            ・下の prefers-reduced-motion で、動きを減らす設定の環境では

        .sakura-container {

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;

        .sakura {

            border-radius: 100% 0 100% 0;
            opacity: 0.2;
            animation: sakura-fall linear infinite;

        @keyframes sakura-fall {
            0%   { transform: translateY(-10%) rotate(0deg);     opacity: 0; }
            10%  { opacity: .45; }
            90%  { opacity: .45; }
            100% { transform: translateY(110vh) rotate(360deg);  opacity: 0; }
        }

        /* 動きを減らす設定を尊重する */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                transition-duration: .001ms !important;
                scroll-behavior: auto !important;
            }
            .lift:hover { transform: none; }
            /* 落下し続ける装飾は、動きを減らす設定では表示しない */
            .sakura-container { display: none; }
